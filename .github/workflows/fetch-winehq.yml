name: Fetch WineHQ Sources

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      matrix: ${{ steps.compare.outputs.matrix }}
      new_stable: ${{ steps.compare.outputs.new_stable }}
      new_master: ${{ steps.compare.outputs.new_master }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Install Nix & Magic Cache
        uses: nixbuild/nix-quick-install-action@v35
      - uses: Mic92/hestia@v3

      - name: Update and Check Changes
        id: compare
        run: |
          OLD_STABLE=$(jq -r '.stable.commit // empty' upstream_wine.json 2>/dev/null || echo "")
          OLD_MASTER=$(jq -r '.master.commit // empty' upstream_wine.json 2>/dev/null || echo "")

          # Retry loop: Run the Nix script up to 5 times if the network/DNS drops
          for i in {1..5}; do
            nix develop .#default --command update-wine-pins && s=0 && break || s=$?
            echo "update-wine-pins failed, retrying ($i/5) in 10 seconds..."
            sleep 10
          done
          (exit $s)

          NEW_STABLE=$(jq -r '.stable.commit // empty' upstream_wine.json 2>/dev/null || echo "")
          NEW_MASTER=$(jq -r '.master.commit // empty' upstream_wine.json 2>/dev/null || echo "")

          MATRIX="[]"
          CHANGED="false"

          if [ "$OLD_STABLE" != "$NEW_STABLE" ] && [ -n "$NEW_STABLE" ]; then
            echo "Stable branch changed."
            MATRIX=$(jq '. += ["stable"]' <<< "$MATRIX")
            CHANGED="true"
          fi

          if [ "$OLD_MASTER" != "$NEW_MASTER" ] && [ -n "$NEW_MASTER" ]; then
            echo "Master branch changed."
            MATRIX=$(jq '. += ["master"]' <<< "$MATRIX")
            CHANGED="true"
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c . <<< "$MATRIX")" >> "$GITHUB_OUTPUT"
          echo "new_stable=$NEW_STABLE" >> "$GITHUB_OUTPUT"
          echo "new_master=$NEW_MASTER" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      # This dynamically spawns builds based on what actually changed!
      matrix:
        mode: ${{ fromJson(needs.check.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/build-and-release.yml
    with:
      source_mode: ${{ matrix.mode }}
      stable_commit: ${{ needs.check.outputs.new_stable }}
      master_commit: ${{ needs.check.outputs.new_master }}
      validate_only: true
    secrets: inherit

  pin-and-pr:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Install Nix & Magic Cache
        uses: nixbuild/nix-quick-install-action@v35
      - uses: Mic92/hestia@v3

      - name: Update pin file
        run: |
          for i in {1..5}; do
            nix develop .#default --command update-wine-pins && s=0 && break || s=$?
            echo "update-wine-pins failed, retrying ($i/5) in 10 seconds..."
            sleep 10
          done
          (exit $s)

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bump/upstream-wine
          title: "Bump Wine ${{ join(fromJson(needs.check.outputs.matrix), ' and ') }}"
          commit-message: "chore: bump wine refs (${{ join(fromJson(needs.check.outputs.matrix), ', ') }})"
          body: |
            Upstream Wine references have been updated:
            - **stable**: `${{ needs.check.outputs.new_stable }}`
            - **master**: `${{ needs.check.outputs.new_master }}`

            Validation builds passed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
