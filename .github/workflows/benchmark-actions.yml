name: Gh Actions Benchmark

on:
  workflow_dispatch:

jobs:
  cache-race:
    name: ${{ matrix.installer }} + ${{ matrix.cache }}
    strategy:
      fail-fast: false
      matrix:
        installer:
          - cachix-installer
          - determinate-installer
          - nixbuild-installer
          - nixos-installer
        cache:
          - magic-nix-cache
          - hestia
          - cache-nix-action
          - none

    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - if: matrix.installer == 'cachix-installer'
        uses: cachix/install-nix-action@v31

      - if: matrix.installer == 'determinate-installer'
        uses: DeterminateSystems/nix-installer-action@main

      - if: matrix.installer == 'nixbuild-installer'
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - if: matrix.installer == 'nixos-installer'
        uses: NixOS/nix-installer-action@main

      - if: matrix.cache == 'magic-nix-cache'
        uses: DeterminateSystems/magic-nix-cache-action@main

      - if: matrix.cache == 'hestia'
        uses: Mic92/hestia@v3

      - name: Start cache-nix-action (with GC enabled)
        if: matrix.cache == 'cache-nix-action'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-macos-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: nix-macos-
          gc-max-store-size-macos: 2G
          purge: true
          purge-prefixes: nix-macos-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Dev Shell Instantiation
        run: |
          echo "Benchmarking ${{ matrix.installer }} with ${{ matrix.cache }}..."

          # Native execution
          time nix --extra-experimental-features "nix-command flakes" develop .#ci --command echo "Success"
