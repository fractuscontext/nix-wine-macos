name: Build Wine on amd64 Darwin

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/**", "README.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Which Wine flavor to compile?"
        type: choice
        options: [crossover, stable, master]
        default: "crossover"
      stable_commit:
        description: "(Optional) Specific stable commit hash to test."
        type: string
        default: ""
      master_commit:
        description: "(Optional) Specific master commit hash to test."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.set.outputs.build }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine Matrix and Mode
        id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Running in PR mode: CONFIGURE ONLY."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Running in Push/Manual mode: FULL COMPILE."
          fi

          MATRIX="[]"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: just test the selected flavor
            MATRIX=$(jq -n --arg m "${{ inputs.source_mode }}" '[$m]')

          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR trigger: Diff the new sources lockfile against the main branch
            OLD=$(git show "origin/${{ github.base_ref }}:_sources/generated.json" 2>/dev/null || echo "{}")
            NEW=$(cat _sources/generated.json 2>/dev/null || echo "{}")

            # Check which specific flavors bumped
            for FLV in "crossover-source:crossover" "wine-stable:stable" "wine-master:master"; do
              KEY=${FLV%%:*}
              VAL=${FLV##*:}
              V_OLD=$(echo "$OLD" | jq -r ".\"$KEY\".version // empty")
              V_NEW=$(echo "$NEW" | jq -r ".\"$KEY\".version // empty")

              if [ "$V_OLD" != "$V_NEW" ] && [ -n "$V_NEW" ]; then
                MATRIX=$(echo "$MATRIX" | jq ". += [\"$VAL\"]")
              fi
            done

            # Fallback if the PR doesn't touch sources (e.g. testing script changes)
            if [ "$MATRIX" = "[]" ]; then MATRIX="[\"crossover\"]"; fi

          else
            # Push to main branch: build crossover by default
            MATRIX="[\"crossover\"]"
          fi

          echo "Computed Matrix: $MATRIX"
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: macos-15
    strategy:
      matrix:
        mode: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    env:
      NIX_DEV: "nix develop .#ci --command"

    outputs:
      wine_tag: ${{ steps.wine_version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: nixbuild/nix-quick-install-action@v35
      - uses: Mic92/hestia@v3

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.mode }}-

      - name: Preheat Nix Environment
        run: $NIX_DEV true

      - name: Extract Source
        run: |
          MODE="${{ matrix.mode }}"
          COMMIT=""

          # 1. Check for manual override commits from workflow inputs
          if [ "$MODE" = "stable" ] && [ -n "${{ inputs.stable_commit }}" ]; then
            COMMIT="${{ inputs.stable_commit }}"
          elif [ "$MODE" = "master" ] && [ -n "${{ inputs.master_commit }}" ]; then
            COMMIT="${{ inputs.master_commit }}"
          fi

          # 2. Extract sources
          if [ -n "$COMMIT" ]; then
            # --- MANUAL GIT PATH ---
            echo "[*] Manual commit provided, fetching directly via Git..."
            mkdir -p sources && git init sources/wine
            git -C sources/wine remote add origin https://gitlab.winehq.org/wine/wine.git
            git -C sources/wine fetch --depth 1 origin "$COMMIT"
            git -C sources/wine checkout --detach FETCH_HEAD
            echo "$MODE-$COMMIT" > sources/wine/WINE_FLAVOUR

          else
            # --- NIX FLAKE PATH (With Retry) ---
            echo "[*] Using Nix flake sources..."
            s=0
            for _ in {1..5}; do
              if $NIX_DEV wine-extract "$MODE"; then
                s=0
                break
              else
                s=$?
              fi
              sleep 10
            done

            if [ "$s" -ne 0 ]; then
              exit "$s"
            fi
          fi

      - name: Extract Wine Version
        id: wine_version
        run: |
          TAG=$(cat sources/wine/WINE_FLAVOUR)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure Wine
        run: $NIX_DEV build-macos configure

      # ALL HEAVY COMPILATION IS SKIPPED IF ON A PULL REQUEST
      - name: Compile Wine
        if: needs.prepare.outputs.build == 'true'
        run: $NIX_DEV build-macos make

      - name: Install Wine
        if: needs.prepare.outputs.build == 'true'
        run: $NIX_DEV build-macos install

      - name: Install DXMT
        if: needs.prepare.outputs.build == 'true'
        run: $NIX_DEV build-macos install-dxmt

      - name: Bundle Dependencies
        if: needs.prepare.outputs.build == 'true'
        run: $NIX_DEV build-macos bundle

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Wine Build Artifact
        uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.build == 'true'
        with:
          name: wine-${{ steps.wine_version.outputs.tag }}-${{ github.run_id }}
          path: output/
          retention-days: 7

  # 3. RELEASE JOB
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: wine-${{ needs.build.outputs.wine_tag }}-${{ github.run_id }}
          path: output/
          skip-decompress: true

      - name: Prepare and Release
        run: mv output/wine-*.zip wine-${{ needs.build.outputs.wine_tag }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.wine_tag }}
          name: ${{ needs.build.outputs.wine_tag }}
          files: wine-${{ needs.build.outputs.wine_tag }}.zip
          generate_release_notes: true
          make_latest: true
